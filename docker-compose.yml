# agentloom local dev stack: Postgres (source of truth) + Redis (queue,
# leases, cache, pub/sub), plus — under the `app` profile (ticket 4.6) —
# the deployables: a one-shot migrate job, the api server, and 2 worker
# replicas.
#
# `make up` boots only the stores (what local development and the
# integration-test suite need); `make up-app` boots the full stack
# (`docker compose --profile app up`). The profile split keeps `make
# test-integration` and CI from building Go images they don't use.
#
# Defaults are dev-only and inline so `make up` works on a clean checkout;
# override them by copying .env.example to .env (auto-loaded by Compose).
name: agentloom

# The in-network DSN the app services share (host tooling uses
# localhost:5432 instead — see internal/config's default).
x-app-env: &app-postgres-dsn postgres://${POSTGRES_USER:-agentloom}:${POSTGRES_PASSWORD:-agentloom}@postgres:5432/${POSTGRES_DB:-agentloom}?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentloom}
      POSTGRES_DB: ${POSTGRES_DB:-agentloom}
    ports:
      - "${AGENTLOOM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      # First boot runs initdb; don't count those probes as failures.
      start_period: 10s

  redis:
    image: redis:7-alpine
    # AOF so durability across down/up doesn't depend on RDB snapshot timing.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${AGENTLOOM_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Dedicated Redis for the sustained chaos suite (ticket 5.8), so the
  # suite's "one Redis restart blip" never disturbs the shared test Redis
  # that every other integration test runs against. The test bounces it by
  # issuing SHUTDOWN NOSAVE through the client; `restart: always` is what
  # brings it back — the blip is Docker's restart latency. AOF means the
  # restart is a connection blip with at most ~1s of tail loss (appendfsync
  # everysec), which is exactly the gap the reconciler must heal.
  redis-chaos:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    ports:
      - "${AGENTLOOM_REDIS_CHAOS_PORT:-6380}:6379"
    volumes:
      - redis-chaos-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: applies embedded schema migrations, then exits. api and
  # worker gate on its success so `make up-app` works on a fresh volume.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/dockerfiles/Dockerfile
      target: migrate
    environment:
      AGENTLOOM_POSTGRES_DSN: *app-postgres-dsn
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/dockerfiles/Dockerfile
      target: api
    environment:
      AGENTLOOM_POSTGRES_DSN: *app-postgres-dsn
      # Bootstrap admin credential for /v1/keys (ticket 6.1, ADR-007).
      # Set it in .env (see .env.example for a generator one-liner);
      # unset, the root auth path simply doesn't exist.
      AGENTLOOM_API_ROOT_KEY: ${AGENTLOOM_API_ROOT_KEY:-}
    ports:
      - "${AGENTLOOM_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/dockerfiles/Dockerfile
      target: worker
    environment:
      AGENTLOOM_POSTGRES_DSN: *app-postgres-dsn
      AGENTLOOM_REDIS_ADDR: redis:6379
      # Pass-through so the crash-recovery demo (make demo-crash) can
      # shorten the lease without editing this file; the default mirrors
      # internal/config's DefaultQueueLeaseTTL. Heartbeat and reclaim
      # intervals derive from the TTL, so one knob retunes all three.
      AGENTLOOM_QUEUE_LEASE_TTL: ${AGENTLOOM_QUEUE_LEASE_TTL:-30s}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

volumes:
  postgres-data:
  redis-data:
  redis-chaos-data:
