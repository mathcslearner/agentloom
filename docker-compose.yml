# agentloom local dev stack: Postgres (source of truth) + Redis (queue,
# leases, cache, pub/sub), plus — under the `app` profile (ticket 4.6) —
# the deployables: a one-shot migrate job, the api server, and 2 worker
# replicas.
#
# `make up` boots only the stores (what local development and the
# integration-test suite need); `make up-app` boots the full stack
# (`docker compose --profile app up`); `make up-obs` adds the `obs`
# profile — Prometheus, Grafana, Jaeger (ticket 7.1, ADR-008) — with
# OTel trace export switched on. The profile split keeps `make
# test-integration` and CI from building Go images they don't use.
#
# Defaults are dev-only and inline so `make up` works on a clean checkout;
# override them by copying .env.example to .env (auto-loaded by Compose).
name: agentloom

# The in-network DSN the app services share (host tooling uses
# localhost:5432 instead — see internal/config's default).
x-app-env: &app-postgres-dsn postgres://${POSTGRES_USER:-agentloom}:${POSTGRES_PASSWORD:-agentloom}@postgres:5432/${POSTGRES_DB:-agentloom}?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentloom}
      POSTGRES_DB: ${POSTGRES_DB:-agentloom}
    ports:
      - "${AGENTLOOM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      # First boot runs initdb; don't count those probes as failures.
      start_period: 10s

  redis:
    image: redis:7-alpine
    # AOF so durability across down/up doesn't depend on RDB snapshot timing.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${AGENTLOOM_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Dedicated Redis for the sustained chaos suite (ticket 5.8), so the
  # suite's "one Redis restart blip" never disturbs the shared test Redis
  # that every other integration test runs against. The test bounces it by
  # issuing SHUTDOWN NOSAVE through the client; `restart: always` is what
  # brings it back — the blip is Docker's restart latency. AOF means the
  # restart is a connection blip with at most ~1s of tail loss (appendfsync
  # everysec), which is exactly the gap the reconciler must heal.
  redis-chaos:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    ports:
      - "${AGENTLOOM_REDIS_CHAOS_PORT:-6380}:6379"
    volumes:
      - redis-chaos-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: applies embedded schema migrations, then exits. api and
  # worker gate on its success so `make up-app` works on a fresh volume.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/dockerfiles/Dockerfile
      target: migrate
    environment:
      AGENTLOOM_POSTGRES_DSN: *app-postgres-dsn
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/dockerfiles/Dockerfile
      target: api
    environment:
      AGENTLOOM_POSTGRES_DSN: *app-postgres-dsn
      # Redis for rate-limit token buckets only (ticket 6.4, ADR-007) —
      # never for dispatch; the middleware fails open if Redis is down.
      AGENTLOOM_REDIS_ADDR: redis:6379
      # Bootstrap admin credential for /v1/keys (ticket 6.1, ADR-007).
      # Set it in .env (see .env.example for a generator one-liner);
      # unset, the root auth path simply doesn't exist.
      AGENTLOOM_API_ROOT_KEY: ${AGENTLOOM_API_ROOT_KEY:-}
      # Telemetry (ticket 7.1, ADR-008). The admin port serving /metrics
      # is in-network only — Prometheus (obs profile) scrapes it; it is
      # never published to the host. OTel export defaults off because the
      # app profile can boot without Jaeger; `make up-obs` turns it on.
      AGENTLOOM_OBS_METRICS_ADDR: :9090
      AGENTLOOM_OBS_OTEL_ENABLED: ${AGENTLOOM_OBS_OTEL_ENABLED:-false}
      AGENTLOOM_OBS_OTEL_ENDPOINT: jaeger:4317
      # Plugin catalog (ticket 8.1, ADR-009): mirror the worker's
      # test-executor knob so GET /v1/plugins lists what the fleet
      # actually executes.
      AGENTLOOM_API_TEST_EXECUTORS: ${AGENTLOOM_WORKER_TEST_EXECUTORS:-true}
    ports:
      # Loopback by default (ticket 6.2, ADR-007): every /v1 route now
      # requires a scoped key, but a dev stack carrying a bootstrap
      # credential still shouldn't listen on all interfaces. Set
      # AGENTLOOM_API_BIND=0.0.0.0 to expose it deliberately.
      - "${AGENTLOOM_API_BIND:-127.0.0.1}:${AGENTLOOM_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/dockerfiles/Dockerfile
      target: worker
    environment:
      AGENTLOOM_POSTGRES_DSN: *app-postgres-dsn
      AGENTLOOM_REDIS_ADDR: redis:6379
      # Pass-through so the crash-recovery demo (make demo-crash) can
      # shorten the lease without editing this file; the default mirrors
      # internal/config's DefaultQueueLeaseTTL. Heartbeat and reclaim
      # intervals derive from the TTL, so one knob retunes all three.
      AGENTLOOM_QUEUE_LEASE_TTL: ${AGENTLOOM_QUEUE_LEASE_TTL:-30s}
      # The compose stack is the dev/demo environment, so the
      # filesystem-writing test executors (counter, effectful_echo) stay
      # registered here — the binary's default is off (ticket 6.2).
      AGENTLOOM_WORKER_TEST_EXECUTORS: ${AGENTLOOM_WORKER_TEST_EXECUTORS:-true}
      # Telemetry (ticket 7.1, ADR-008) — see the api service's note. The
      # two replicas each bind :9090 inside their own container; Prometheus
      # finds both via DNS service discovery on the service name.
      AGENTLOOM_OBS_METRICS_ADDR: :9090
      AGENTLOOM_OBS_OTEL_ENABLED: ${AGENTLOOM_OBS_OTEL_ENABLED:-false}
      AGENTLOOM_OBS_OTEL_ENDPOINT: jaeger:4317
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

  # ---- Observability stack (ticket 7.1, ADR-008): `--profile obs`. ----
  # `make up-obs` boots app + obs together with OTel export enabled.

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Example alert rules (ticket 7.5), referenced by rule_files above.
      - ./deploy/observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${AGENTLOOM_PROMETHEUS_BIND:-127.0.0.1}:${AGENTLOOM_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 2s
      timeout: 3s
      retries: 15

  grafana:
    profiles: [obs]
    image: grafana/grafana:11.6.6
    environment:
      # Dev-only anonymous admin: the stack binds loopback and carries no
      # real credentials worth protecting behind a Grafana login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboards-as-code (ticket 7.5): the provisioning/dashboards file
      # provider reads JSON from this mount (outside /var/lib/grafana so
      # it never nests inside the grafana-data volume).
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${AGENTLOOM_GRAFANA_BIND:-127.0.0.1}:${AGENTLOOM_GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy

  # Jaeger all-in-one accepts OTLP directly (COLLECTOR_OTLP_ENABLED), so
  # no separate collector hop is needed in dev (ADR-008). The OTLP gRPC
  # port (4317) stays in-network; only the UI is published.
  jaeger:
    profiles: [obs]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${AGENTLOOM_JAEGER_BIND:-127.0.0.1}:${AGENTLOOM_JAEGER_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  redis-data:
  redis-chaos-data:
  prometheus-data:
  grafana-data:
