# promtool unit tests for prometheus-rules.yml (ticket 7.5): each alert
# fires on a synthetic series shaped like its failure mode, plus one
# negative case proving a healthy-but-busy queue stays quiet. Run via
# `make obs-lint` (promtool test rules); CI runs it in the lint job.
rule_files:
  - prometheus-rules.yml

evaluation_interval: 1m

tests:
  # QueueDepthGrowing: depth climbing 5 rows/min never stops — elevated
  # AND growing versus 10m ago, so after the 5m hold it fires.
  - interval: 1m
    input_series:
      - series: 'engine_queue_ready_depth{job="worker", instance="w1"}'
        values: "0+5x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: QueueDepthGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Ready-queue depth is growing"
              description: >-
                engine_queue_ready_depth has been above 10 and growing versus
                10 minutes ago, sustained for 5 minutes. Workers are not
                keeping up with dispatch: check engine_worker_active (fleet
                size), engine_step_duration_seconds (slow executors), and the
                worker logs.

  # Negative: a deep-but-draining queue (high, shrinking) must not fire —
  # the rule watches growth, not absolute depth.
  - interval: 1m
    input_series:
      - series: 'engine_queue_ready_depth{job="worker", instance="w1"}'
        values: "200-5x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: QueueDepthGrowing
        exp_alerts: []

  # DeadLetterRateSpike: one dead letter per minute (~0.017/s) clears the
  # 0.01/s example threshold.
  - interval: 1m
    input_series:
      - series: 'engine_step_dead_letters_total{source="retries_exhausted", job="worker", instance="w1"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: DeadLetterRateSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Steps are dead-lettering"
              description: >-
                engine_step_dead_letters_total is rising faster than 0.01/s
                over 5 minutes. Split by source on the Engine dashboard:
                retries_exhausted points at a failing dependency, permanent at
                bad definitions or config, poison at crash-looping handlers.
                Inspect dead_letters rows and requeue after fixing the cause.

  # ReclaimRateSpike: one reclaim per minute — a worker is dying or
  # stalling past the lease TTL every minute.
  - interval: 1m
    input_series:
      - series: 'engine_queue_reclaimed_total{job="worker", instance="w1"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: ReclaimRateSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Lease reclaims are spiking"
              description: >-
                engine_queue_reclaimed_total is rising: workers are dying or
                stalling past the lease TTL and their deliveries are being
                reclaimed. Expect matching engine_step_takeovers_total
                movement. Check worker crash logs, GC/CPU stalls, and whether
                the lease TTL is sized below the slowest legitimate step.

  # OutboxDispatchLag: the oldest pending row jumps past 30s and stays
  # there (drain stalled); fires after the 2m hold.
  - interval: 1m
    input_series:
      - series: 'engine_outbox_oldest_age_seconds{job="worker", instance="w1"}'
        values: "0 0 0 60 60 60 60 60 60 60"
    alert_rule_test:
      - eval_time: 8m
        alertname: OutboxDispatchLag
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Outbox dispatch is lagging"
              description: >-
                The oldest pending task_outbox row is over 30 seconds old,
                sustained for 2 minutes. The transactional-outbox drain is
                stalled: check Redis reachability from workers, dispatcher
                errors in worker logs, and engine_dispatch_dispatched_total
                (flat = nothing draining). Runs are frozen until it recovers.

  # BudgetParkRateSpike: one budget park per minute (~0.017/s) clears the
  # 0.01/s example threshold after the 5m hold.
  - interval: 1m
    input_series:
      - series: 'engine_cost_budget_exceeded_total{limit="run", action="park", job="worker", instance="w1"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: BudgetParkRateSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Runs are parking on budget"
              description: >-
                engine_cost_budget_exceeded_total{action="park"} is rising
                faster than 0.01/s over 5 minutes: budgeted runs are hitting
                their caps and parking. Check the Cost row on the Engine
                dashboard for spend rate by resource, and raise budgets (PATCH
                /v1/runs/{id}/budget) or add model_fallbacks to resume them.

  # ValidationFailureRatioHigh: verdicts flowing at 2/min with half failing
  # (>30%), sustained — fires after the 5m hold.
  - interval: 1m
    input_series:
      - series: 'engine_validate_verdicts_total{status="fail", step_type="llm", resource="mock:sim-1", job="worker", instance="w1"}'
        values: "0+1x30"
      - series: 'engine_validate_verdicts_total{status="pass", step_type="llm", resource="mock:sim-1", job="worker", instance="w1"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: ValidationFailureRatioHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Output-validation failure ratio is high"
              description: >-
                Over 30% of output-validation verdicts are failing, sustained
                for 5 minutes with real verdict flow. Check the Output-quality
                row on the Engine dashboard: the failure ratio by resource
                points at the offending model, the validator-results panel at
                which validator is rejecting, and the semantic-retry depth at
                whether the feedback loop is converging. A rising unrepairable
                share on the repair panel is malformed output at the source.

  # Negative: verdicts flowing but all passing — the ratio is zero, so the
  # rule stays quiet despite real verdict traffic.
  - interval: 1m
    input_series:
      - series: 'engine_validate_verdicts_total{status="pass", step_type="llm", resource="mock:sim-1", job="worker", instance="w1"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: ValidationFailureRatioHigh
        exp_alerts: []
