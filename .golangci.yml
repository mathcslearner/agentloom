version: "2"

run:
  # Lint the integration-tagged files too; without this they'd never be
  # analyzed (the tag only ever gates test files, so this is always safe).
  build-tags:
    - integration

linters:
  # Standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
  exclusions:
    paths:
      # sqlc-generated code (make generate) is not held to hand-written style.
      - internal/store/gen
    rules:
      # The event payloads (ADR-018) satisfy the event.Payload / event.StepScoped
      # interfaces with trivial one-line marker methods; a doc comment per method
      # would be pure boilerplate. The types themselves are documented.
      - path: internal/event/payloads\.go
        linters:
          - revive
        text: "exported method .*\\.(EventType|EventStepID) should have comment"
      # events.go re-exports the event package's payload structs as aliases so
      # engine/api keep referencing store.XxxEvent; the real docs live on the
      # event package types, not on the one-line aliases.
      - path: internal/store/events\.go
        linters:
          - revive
        text: "(should have comment or be unexported|comment on exported type .* should be of the form)"
      # NopMetrics (ticket 16.2) is the no-op pubsub.Metrics: four trivial
      # one-line marker methods a doc comment per method would only clutter.
      - path: internal/event/pubsub/metrics\.go
        linters:
          - revive
        text: "exported method NopMetrics\\.(EventPublished|PublishFailed|PublishDropped|PublishLatency) should have comment"

formatters:
  enable:
    - gofumpt
    - gci
  exclusions:
    paths:
      - internal/store/gen
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
