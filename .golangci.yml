version: "2"

run:
  # Lint the integration-tagged files too; without this they'd never be
  # analyzed (the tag only ever gates test files, so this is always safe).
  build-tags:
    - integration

linters:
  # Standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
  exclusions:
    paths:
      # sqlc-generated code (make generate) is not held to hand-written style.
      - internal/store/gen

formatters:
  enable:
    - gofumpt
    - gci
  exclusions:
    paths:
      - internal/store/gen
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
