# agentloom API contract (ticket 6.6). Hand-maintained — this file IS the
# contract; internal/api implements it and cmd/ctl consumes it. Keep the
# three in lockstep:
#
#   - Route drift is caught by TestOpenAPIRouteCoverage (internal/api),
#     which compares the chi route table against `paths` in both
#     directions — a new route cannot ship undocumented, and a documented
#     path cannot outlive its handler.
#   - `make openapi-lint` (vacuum) validates and lints the spec; CI runs
#     both.
#   - The workflow-definition schema is NOT duplicated here: it is
#     $ref'd from the generated docs/schema/workflow-definition.v1.json
#     (source of truth: the Go structs in internal/dag; regenerate with
#     `make generate`). OpenAPI 3.1 speaks JSON Schema 2020-12, which is
#     exactly what the generator emits.
#
# Wire-shape source: internal/api/types.go. Scope + rate-limit class per
# route: ADR-007's tables (mirrored in internal/api/api.go's route
# comment).
openapi: 3.1.0

info:
  title: agentloom API
  version: v1
  summary: Durable execution engine for AI agent workflows — control-plane API.
  description: |
    The agentloom API submits and steers workflow runs, manages the stored
    definition registry, and administers API keys. Execution itself is
    asynchronous: submission writes the run and its outbox rows in one
    Postgres transaction, and the worker fleet picks the work up from
    there (ADR-002 — the API never dispatches).

    ## Authentication

    Every `/v1` route requires a bearer API key (`Authorization: Bearer
    sk_...`) carrying the route's scope — `submit`, `read`, or `admin`
    (`approve` is reserved until M15; `admin` implies all scopes). Any
    credential failure is a uniform `401` with code `unauthorized`; a
    valid key lacking the route's scope is a `403` with code `forbidden`
    naming the missing scope. `GET /healthz` is the only anonymous route.
    See ADR-007 for the key model (`sk_` + 43 base64url chars, hashed at
    rest, plaintext shown exactly once by `POST /v1/keys`).

    ## Rate limiting

    After auth, every `/v1` request draws from the caller's per-key token
    bucket for the route's class (`submit`, `read`, or `admin`) and from
    a global safety bucket. When rate limiting is enabled, every `/v1`
    response — success or denial — carries `X-RateLimit-Limit`,
    `X-RateLimit-Remaining`, and `X-RateLimit-Reset` (whole seconds until
    full) describing the caller's class bucket. A denial is `429` with
    code `rate_limited` and a `Retry-After` header (whole seconds,
    rounded up, from whichever bucket denied).

    ## Errors

    Every non-2xx response carries the JSON envelope
    `{"error": {"code", "message", "issues?"}}`. `code` is a stable
    machine-readable string (renaming one is a breaking change);
    definition problems carry the path-qualified `issues` list verbatim
    from validation.

servers:
  - url: http://127.0.0.1:8080
    description: Local compose stack (`make up-app`; binds 127.0.0.1 by default).

security:
  - bearerAuth: []

tags:
  - name: Runs
    description: Submit, inspect, and steer workflow runs.
  - name: Events
    description: Live event streaming — the multi-run firehose WebSocket (ADR-018).
  - name: Definitions
    description: The stored, versioned workflow-definition registry.
  - name: Approvals
    description: Human-in-the-loop approval inbox and decisions (ADR-017).
  - name: Plugins
    description: The plugin catalog — manifests and config schemas (ADR-009).
  - name: Cache
    description: Response-cache invalidation and statistics (admin scope, ADR-011).
  - name: Keys
    description: API key administration (admin scope).
  - name: Health
    description: Unauthenticated liveness probe.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness probe
      description: >
        Reports liveness: `200` while Postgres answers a ping, `503`
        otherwise. Anonymous by design — probes need no secret.
      security: []
      responses:
        "200":
          description: The API is serving and Postgres answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example: { status: ok }
        "503":
          description: Postgres did not answer the ping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example: { status: degraded }

  /v1/runs:
    post:
      operationId: submitRun
      tags: [Runs]
      summary: Submit a run
      description: |
        Scope `submit`, rate-limit class `submit`. Instantiates a run from
        an inline definition document or a stored definition reference
        (exactly one of `definition` / `definition_id`). The run, its
        per-run graph copy, entry-ready steps, and their dispatch outbox
        rows are written in one transaction; workers pick the run up
        asynchronously.

        Idempotent submission rides the `Idempotency-Key` header:
        resubmitting the same key with the same payload (definition
        snapshot + canonicalized params + definition ref) returns the
        original run as `200` with `reused: true`; the same key with a
        different payload is refused with `409 idempotency_key_conflict`.
        Keys are global, not per-API-key.

        An inline definition that fails decoding or validation is a `400`
        with code `invalid_definition` and the path-qualified `issues`
        list. A `definition_id` that resolves to nothing is a `400` with
        code `definition_not_found`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: The definition (inline or by ref) and opaque run parameters.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRunRequest"
            examples:
              inline:
                summary: Inline definition
                value:
                  definition:
                    schema_version: 1
                    name: hello
                    steps:
                      - id: greet
                        type: echo
                        config: { input: { text: "hello, agentloom" } }
                    edges: []
                  params: { audience: world }
              by-ref:
                summary: Stored definition reference
                value:
                  definition_id: 018f3b1c-0000-7000-8000-000000000000
                  params: { audience: world }
      responses:
        "201":
          description: The run was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitRunResponse"
              example:
                run_id: 018f3b1c-1111-7000-8000-000000000000
                status: running
                entry_steps: [greet]
        "200":
          description: >
            The `Idempotency-Key` matched an earlier submission with the
            same payload; this is the original run, replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitRunResponse"
              example:
                run_id: 018f3b1c-1111-7000-8000-000000000000
                status: succeeded
                entry_steps: [greet]
                reused: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: listRuns
      tags: [Runs]
      summary: List runs
      description: |
        Scope `read`, rate-limit class `read`. One keyset page, newest
        first — order `(created_at DESC, id DESC)` — with optional
        filters. Feed `next_cursor` back verbatim as `?cursor=` for the
        next page; its absence means this was the last page. Keyset
        pagination is stable under concurrent inserts: new runs sort
        before any already-issued cursor position, so a walk never skips
        or repeats a row.
      parameters:
        - name: status
          in: query
          description: Only runs in this status.
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: definition_id
          in: query
          description: Only runs instantiated from this stored definition.
          schema:
            type: string
            format: uuid
        - name: created_after
          in: query
          description: Only runs created strictly after this instant (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          description: Only runs created strictly before this instant (RFC 3339).
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRunsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}:
    get:
      operationId: getRun
      tags: [Runs]
      summary: Get one run
      description: |
        Scope `read`, rate-limit class `read`. The run row, every step
        with its full attempt history, every edge with its resolution,
        and the run's dead-letter records (how a client discovers
        requeueable steps — empty for healthy runs). Reads are not one
        snapshot: a run mid-flight may show a step newer than its rollup
        counters; the next poll heals it.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run in full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}/cost:
    get:
      operationId: getRunCost
      tags: [Runs]
      summary: Get a run's cost breakdown
      description: |
        Scope `read`, rate-limit class `read`. The run's cumulative cost
        (ADR-012) — cumulative spend and cache savings — plus per-step and
        per-resource (per-model / per-tool) breakdowns and the full
        per-attempt ledger. Money is integer nano-USD (1 USD = 1e9); the
        `*_usd` strings are the derived human-readable rendering. A run with
        no cost-bearing attempts returns a zero summary and empty
        breakdowns.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run's cost breakdown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      tags: [Runs]
      summary: Cancel a run
      description: |
        Scope `submit`, rate-limit class `submit`. Requests cooperative
        cancellation (reason `manual`). The response reports what settled
        in the request transaction — claimless pending/ready/retrying
        steps are cancelled immediately; in-flight steps converge
        afterwards as their workers notice (the run rests at `cancelling`
        until then, `cancelled` when `finalized` is true). Cancelling a
        run already in a terminal state is a `409` with code `conflict`.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Cancellation requested (or finalized, when nothing was in flight).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}/park:
    post:
      operationId: parkRun
      tags: [Runs]
      summary: Park a run
      description: |
        Scope `submit`, rate-limit class `submit`. Pauses dispatch
        (reason `manual`): workers refuse new claims on the run's steps
        while in-flight steps keep executing and settle normally. Parking
        a run that is not `running` is a `409` with code `conflict`.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run is parked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}/unpark:
    post:
      operationId: unparkRun
      tags: [Runs]
      summary: Unpark a run
      description: |
        Scope `submit`, rate-limit class `submit`. Resumes dispatch,
        re-dispatching every ready step whose queue delivery was consumed
        while the run was parked (`dispatched`). Unparking a run that is
        not `parked` is a `409` with code `conflict`.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run is running again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnparkRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}/budget:
    patch:
      operationId: setRunBudget
      tags: [Runs]
      summary: Raise a run's spend budget
      description: |
        Scope `submit`, rate-limit class `submit`. Sets the run's spend
        budget (`budget_usd`, positive US dollars). Combined with `unpark`,
        this is the documented resume path for a run parked with reason
        `budget_exceeded`: raise the budget, then unpark. Raising the budget
        does not itself dispatch work (ADR-002). The budget is immutable on a
        terminal run — a `409` with code `conflict`.
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        description: The new spend budget in US dollars.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBudgetRequest"
      responses:
        "200":
          description: The run with its updated cost/budget summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetBudgetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}/steps/{step_id}/requeue:
    post:
      operationId: requeueStep
      tags: [Runs]
      summary: Requeue a dead-lettered step
      description: |
        Scope `submit`, rate-limit class `submit`. Resets a dead-lettered
        step to `ready` with its retry budget re-armed (counted failures
        restart from the dead-letter baseline; attempt history stays
        immutable), re-opens the run when it rested at `failed`
        (`run_resumed`), and revives written-off descendants (`revived`).
        Requeueing a step that is not dead-lettered — or any step of a
        cancelled run — is a `409` with code `conflict`. A missing run is
        `404 run_not_found`; an existing run without that step is
        `404 step_not_found`.
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/StepID"
      responses:
        "200":
          description: The step is back in ready and dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequeueStepResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}/steps/{step_id}/logs:
    get:
      operationId: getStepLogs
      tags: [Runs]
      summary: Get one attempt's captured executor logs
      description: |
        Scope `read`, rate-limit class `read`. One ascending-seq keyset
        page of the log lines the step's executor emitted through its
        step logger, captured durably per attempt (retries, reclaims,
        and takeovers each get their own attempt and so their own log
        stream). Lines carry the attempt's `trace_id` for joining to
        traces. `attempt` defaults to the step's latest; an attempt with
        no lines — never reached, level-filtered at capture, or simply
        quiet — answers an empty page, not a `404`. Storage is a
        size-capped ring with a bounded capture buffer, both dropping
        oldest: `truncated`/`dropped_lines` report what was lost, and
        the retained window is the newest lines. Poll for follow-mode;
        there is no streaming channel in v1. A missing run is
        `404 run_not_found`; an existing run without that step is
        `404 step_not_found`.
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/StepID"
        - name: attempt
          in: query
          description: The 1-based attempt whose logs to read; default the step's latest.
          schema:
            type: integer
            minimum: 1
        - name: level
          in: query
          description: Minimum severity; lines below it are filtered out.
          schema:
            $ref: "#/components/schemas/LogLevel"
        - name: limit
          in: query
          description: Page size; an integer in [1, 1000].
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: One page of log lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepLogsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}/blackboard:
    get:
      operationId: getRunBlackboard
      tags: [Runs]
      summary: Get the run's blackboard entries
      description: |
        Scope `read`, rate-limit class `read`. The run-scoped blackboard
        (ADR-014): versioned key/value shared memory steps read and write
        during the run. By default each key's head (latest version) is
        returned, ordered by key; `history=true` returns every version,
        ordered by `(key, version)`. Filter by `key` (repeatable) and by
        `tag` (repeatable — an entry must carry every listed tag). Each
        entry carries its `token_count` under a `token_counter` fingerprint
        and its author step. Results page by an opaque keyset `cursor`. A
        missing run is `404 run_not_found`.
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: key
          in: query
          description: Restrict to these keys (repeatable).
          schema:
            type: array
            items:
              type: string
        - name: tag
          in: query
          description: Keep only entries carrying every listed tag (repeatable; AND).
          schema:
            type: array
            items:
              type: string
        - name: history
          in: query
          description: When true, return every version, not just each key's head.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Maximum entries per page; an integer in [1, 1000].
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: One page of blackboard entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlackboardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}/graph:
    get:
      operationId: getRunGraph
      tags: [Runs]
      summary: Get the run's versioned graph with provenance
      description: |
        Scope `read`, rate-limit class `read`. The run's current versioned
        graph (ADR-015): every node and edge with its provenance — whether it
        was authored in the definition or injected by a planner / map / loop
        expansion, the step that injected it, the expansion nesting depth, the
        graph version at which it was introduced, and the time it was added.
        `graph_version` is the current (highest) version; the authored graph is
        version 1 and each expansion bumps it (so `graph_version` equals the
        run's expansion count + 1). `expansions` is the ordered per-version
        delta feed reconstructed from the run's `graph_expanded` events — the
        contract the dashboard uses to animate expansion. A client reconstructs
        any version N by keeping the nodes and edges whose `graph_version` is at
        most N. A run that never expanded returns its authored graph with an
        empty `expansions` list. A missing run is `404 run_not_found`.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run's versioned graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunGraphResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}/ws-ticket:
    post:
      operationId: mintRunWSTicket
      tags: [Runs]
      summary: Mint a short-lived ticket for the run event WebSocket
      description: |
        Scope `read`, rate-limit class `read`. Mints a short-lived, signed,
        opaque ticket scoped to this one run and the `read` scope (ticket 16.3,
        ADR-018). A browser cannot set an `Authorization` header on a WebSocket,
        so it passes this ticket to `GET /v1/runs/{run_id}/ws` as a `ticket`
        query parameter instead of a long-lived bearer key (which would leak
        into logs, proxies, and history). The ticket expires quickly
        (`expires_at`); the client re-mints when it expires. A missing run is
        `404 run_not_found`; `503 stream_unavailable` when event streaming is not
        enabled on this server.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: A signed ticket for the run WebSocket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WSTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/StreamUnavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/runs/{run_id}/ws:
    get:
      operationId: streamRunEvents
      tags: [Runs]
      summary: Stream a run's live event feed over WebSocket
      description: |
        Rate-limit class `read`. Upgrades to a WebSocket and streams the run's
        normalized event feed (ticket 16.3, ADR-018). Authentication is EITHER a
        `ticket` query parameter (minted at `POST .../ws-ticket`, the browser
        path) OR a `read`-scoped bearer key (for non-browser clients); a failure
        is the uniform `401`. An optional `last_seq` query parameter resumes the
        stream after that seq.

        Protocol (JSON text frames, discriminated by `type`): the server sends
        one `snapshot` frame (the `GET /v1/runs/{run_id}` body), then `event`
        frames backfilled from `last_seq`, then a `caught_up` frame, then live
        `event` frames as the run progresses. Clients dedupe and order by
        `(run_id, seq)` and resume after a disconnect by reconnecting with
        `last_seq` set to the highest seq seen — recovery is deterministic
        because every mechanism reduces to a DB read after `last_seq`. A client
        that falls too far behind is closed with application close code `4001`
        (slow consumer) and resumes with its `last_seq`. `503 stream_unavailable`
        when event streaming is not enabled on this server.
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: ticket
          in: query
          required: false
          schema:
            type: string
          description: A ticket from POST .../ws-ticket (the browser auth path).
        - name: last_seq
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Resume cursor — the highest event seq the client has seen.
      responses:
        "101":
          description: |
            The connection is upgraded to a WebSocket. Frames follow the
            snapshot → backfill → live-tail protocol described above. The
            content schema below documents the frame shapes (a text frame is one
            of these); it is not a conventional HTTP body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WSSnapshotFrame"
                  - $ref: "#/components/schemas/WSEventFrame"
                  - $ref: "#/components/schemas/WSCaughtUpFrame"
                  - $ref: "#/components/schemas/WSErrorFrame"
                discriminator:
                  propertyName: type
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/StreamUnavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/events/ws-ticket:
    post:
      operationId: mintFirehoseWSTicket
      tags: [Events]
      summary: Mint a short-lived ticket for the multi-run firehose WebSocket
      description: |
        Scope `read`, rate-limit class `read`. Mints a short-lived, signed,
        opaque ticket scoped to the firehose audience and the `read` scope
        (ticket 16.4, ADR-018). Unlike the run ticket it is not bound to a run —
        the firehose is cross-run and narrowed by the client's `subscribe`
        filters. The ticket expires quickly (`expires_at`); the client re-mints
        when it expires. `503 stream_unavailable` when event streaming is not
        enabled on this server.
      responses:
        "200":
          description: A signed ticket for the firehose WebSocket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WSTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/StreamUnavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/events/ws:
    get:
      operationId: streamEvents
      tags: [Events]
      summary: Stream a filtered, multi-run event feed over WebSocket
      description: |
        Rate-limit class `read`. Upgrades to a WebSocket and streams a filtered,
        cross-run event feed for the dashboard's run list (ticket 16.4,
        ADR-018). Authentication is EITHER a `ticket` query parameter (minted at
        `POST /v1/events/ws-ticket`, the browser path) OR a `read`-scoped bearer
        key (for non-browser clients); a failure is the uniform `401`.

        Protocol (JSON text frames, discriminated by `type`). The client manages
        subscriptions with control messages: `subscribe` (`{type, id, filter,
        cursors}`) opens or replaces one filtered subscription; `unsubscribe`
        (`{type, id}`) cancels it. The server replies with a `subscribed` ack,
        then `event` frames backfilled from any `cursors`, a `caught_up` frame,
        then live `event` frames — each tagged with the `subscriptions` ids it
        matched. A malformed or over-limit control message yields an in-band
        `error` frame and leaves the connection open. Filters (`run_ids`,
        `types`, `definition_id`, `definition_name`) are ANDed; clients dedupe
        and order by `(run_id, seq)` and resume runs via `cursors`. A client that
        falls too far behind is closed with application close code `4001` (slow
        consumer) and resumes. `503 stream_unavailable` when event streaming is
        not enabled on this server.
      parameters:
        - name: ticket
          in: query
          required: false
          schema:
            type: string
          description: A ticket from POST /v1/events/ws-ticket (the browser auth path).
      responses:
        "101":
          description: |
            The connection is upgraded to a WebSocket. Frames follow the
            subscribe → backfill → live-tail protocol described above. The
            content schema below documents the frame shapes (a text frame is one
            of these); it is not a conventional HTTP body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WSEventFrame"
                  - $ref: "#/components/schemas/WSSubscribedFrame"
                  - $ref: "#/components/schemas/WSUnsubscribedFrame"
                  - $ref: "#/components/schemas/WSFirehoseCaughtUpFrame"
                  - $ref: "#/components/schemas/WSErrorFrame"
                discriminator:
                  propertyName: type
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/StreamUnavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/definitions:
    post:
      operationId: createDefinition
      tags: [Definitions]
      summary: Register a definition
      description: |
        Scope `submit`, rate-limit class `submit`. Registers a validated
        definition under its spec `name` at version 1; the stored spec is
        the canonical encoding. An existing name is a `409` with code
        `conflict` pointing at the versions route — appending versions is
        deliberate, never accidental. A definition that fails decoding or
        validation is a `400` with code `invalid_definition` and the
        `issues` list.
      requestBody:
        required: true
        description: The definition document to register.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDefinitionRequest"
      responses:
        "201":
          description: The definition is stored at version 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: listDefinitions
      tags: [Definitions]
      summary: List definitions (latest per name)
      description: |
        Scope `read`, rate-limit class `read`. One keyset page of each
        name's newest version, in name order. Feed `next_cursor` back
        verbatim as `?cursor=` for the next page.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: One page of definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDefinitionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/definitions/{definition_id}:
    get:
      operationId: getDefinition
      tags: [Definitions]
      summary: Get one stored definition
      description: >
        Scope `read`, rate-limit class `read`. One registry row with its
        stored canonical spec.
      parameters:
        - name: definition_id
          in: path
          required: true
          description: The stored definition's UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The stored definition, spec included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/definitions/{name}/versions:
    get:
      operationId: listDefinitionVersions
      tags: [Definitions]
      summary: List every version of one name
      description: >
        Scope `read`, rate-limit class `read`. Every version of one
        definition name, oldest first. An unknown name is a `404` — an
        empty list would be indistinguishable from a typo.
      parameters:
        - $ref: "#/components/parameters/DefinitionName"
      responses:
        "200":
          description: All versions of the name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionVersionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createDefinitionVersion
      tags: [Definitions]
      summary: Append the next version of an existing name
      description: |
        Scope `submit`, rate-limit class `submit`. Appends the next
        version of an existing name; version numbers are allocated
        serially, so concurrent appenders get consecutive versions. The
        body's spec `name` must match the path — a mismatch is a `400`,
        not a rename. An unknown name is a `404` pointing at
        `POST /v1/definitions`. An optional `If-Match` header (the version
        the client opened) is an optimistic-concurrency precondition: if the
        name's latest version has advanced since, the append is refused with
        `409 version_conflict` (a stale save) instead of silently forking.
      parameters:
        - $ref: "#/components/parameters/DefinitionName"
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        description: The new version's definition document; its `name` must match the path.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDefinitionRequest"
      responses:
        "201":
          description: The new version is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/approvals:
    get:
      operationId: listApprovals
      tags: [Approvals]
      summary: List human-approval requests
      description: |
        Scope `read`, rate-limit class `read`. One keyset page of human-approval
        records (ADR-017, ticket 15.3), oldest-first — the pending-approval
        inbox. Filter by `status` (pending / approved / rejected / expired /
        cancelled) and/or `run_id`. Pagination is stable: a page's `next_cursor`
        feeds the next request verbatim.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, expired, cancelled]
          description: Filter to one approval status (default = all).
        - name: run_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to one run's approvals.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: Page size (default 50, max 200).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous page's next_cursor.
      responses:
        "200":
          description: One page of approvals, oldest-first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/approvals/{approvalID}:decide:
    post:
      operationId: decideApproval
      tags: [Approvals]
      summary: Decide a pending approval
      description: |
        Scope `approve`, rate-limit class `submit`. Resolves one pending
        human-approval request (ADR-017, ticket 15.3) through the single
        compare-and-swap arbiter: approve (or a reject routed via
        `on_reject: route`) succeeds the parked step with the decision output
        `{approval_id, decision, payload, edited, comment, decided_by,
        decided_at, source}` and dispatches its successors on the fleet's drain
        cadence; a reject under `on_reject: fail` dead-letters the step
        (permanent) and applies the run's `on_failure` disposition. An
        `edited_payload` is accepted only on approve and only when the gate
        permits edits, and is validated against the gate's edit schema. The
        actor key id, timestamp, and comment are recorded immutably. The run
        must be running or parked; a decision on a run that has since failed or
        finished is a 409. A double-decide (or a decision racing a timeout
        expiry) is a 409 `approval_not_pending`.
      parameters:
        - name: approvalID
          in: path
          required: true
          description: The approval's UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: The decision, an optional edited payload, and an optional comment.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalRequest"
      responses:
        "200":
          description: The decision was recorded and the step settled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideApprovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/DecisionInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/plugins:
    get:
      operationId: listPlugins
      tags: [Plugins]
      summary: List plugins
      description: |
        Scope `read`, rate-limit class `read`. The plugin catalog
        compiled into the API binary (ticket 8.1, ADR-009): every
        registered plugin's manifest — kind, name, semver version,
        capability flags — with its generated config JSON Schema embedded
        verbatim (`config_schema`), the machine-usable form UI config
        panels consume. Sorted by kind (executor, tool, retriever,
        model_provider, validator) then name. Under the in-process
        compilation model the catalog is a build-time property, so the
        listing describes the fleet as long as API and workers ship from
        the same build with matching test-executor knobs. Model providers
        (ticket 8.4) additionally require an API key to be constructed, so
        the catalog lists exactly the providers the deployment has
        configured — set the same provider keys on API and workers.
      responses:
        "200":
          description: The full catalog — one page, no pagination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPluginsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/cache/bust:
    post:
      operationId: bustCache
      tags: [Cache]
      summary: Bust response-cache entries
      description: |
        Scope `admin`, rate-limit class `admin`. Removes response-cache
        entries (ticket 9.6, ADR-011) by namespace: an empty body busts
        every entry, `plugin_kind` alone busts one kind (all model
        providers, all tools, or all retrievers), and `plugin_kind` with
        `plugin_name` busts one concrete plugin. Deletion is `SCAN`-batched
        and non-blocking (`UNLINK`); the response reports how many keys were
        removed. Semantics are point-in-time — an entry a live worker writes
        after the scan passed its slot survives. A single run's entries
        cannot be busted (run scope mixes the run id into the entry hash, not
        the key; its only bound is the TTL). The action is audit-logged with
        the actor key id. Returns `503` when the cache is not enabled on this
        API (the cache is an opt-in extra, never a boot dependency).
      requestBody:
        required: false
        description: The namespace selector; omit the body to bust everything.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CacheBustRequest"
            example:
              plugin_kind: model_provider
              plugin_name: mock
      responses:
        "200":
          description: The bust completed; `deleted` is the entry count removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheBustResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/CacheUnavailable"

  /v1/cache/stats:
    get:
      operationId: cacheStats
      tags: [Cache]
      summary: Response-cache statistics
      description: |
        Scope `admin`, rate-limit class `admin`. Per-plugin cumulative cache
        counters (ticket 9.6, ADR-011): hits, misses, stores, and the
        derived hit rate for each concrete plugin the fleet has cached
        against. The counters are kept in Redis by the worker fleet's cache
        store, so the API serves them without a worker (ADR-002); they
        reconcile against the fleet's `engine_cache_*` Prometheus counters on
        the normal path. Returns `503` when the cache is not enabled on this
        API.
      responses:
        "200":
          description: Per-plugin counters, sorted by kind then name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/CacheUnavailable"

  /v1/keys:
    post:
      operationId: createKey
      tags: [Keys]
      summary: Mint an API key
      description: |
        Scope `admin`, rate-limit class `admin`. Mints a bearer key and
        returns the plaintext — in this response once and recoverable
        nowhere else (only the SHA-256 hash and an 11-character lookup
        prefix are stored). Expiry is requested as a TTL (positive Go
        duration, e.g. `"720h"`) and resolved against the server's clock;
        empty means the key never expires. The first key is minted with
        the env-provided root credential (`AGENTLOOM_API_ROOT_KEY`,
        implicit admin) — set it, mint a stored admin key, unset it.
      requestBody:
        required: true
        description: The key's label, scope set, and optional TTL.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
            example:
              name: ci-submitter
              scopes: [submit, read]
              ttl: 720h
      responses:
        "201":
          description: The key, plaintext included — shown exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: listKeys
      tags: [Keys]
      summary: List API keys
      description: >
        Scope `admin`, rate-limit class `admin`. Every key, newest first,
        revoked and expired included — lookup prefixes only, never hashes
        or plaintext.
      responses:
        "200":
          description: All keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListKeysResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/keys/{key_id}:
    delete:
      operationId: revokeKey
      tags: [Keys]
      summary: Revoke an API key
      description: >
        Scope `admin`, rate-limit class `admin`. Soft revocation, first
        wins and idempotent — revoking an already-revoked key is a `204`
        no-op keeping the original `revoked_at`.
      parameters:
        - name: key_id
          in: path
          required: true
          description: The key's UUID (not its prefix).
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The key is revoked (or already was).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_<43 base64url chars>
      description: >
        API key per ADR-007. Scopes (`submit`, `read`, `approve`,
        `admin`) are granted per key and checked per route; `admin`
        implies all. Every credential failure is an indistinguishable
        `401`; a missing scope is a `403` naming it.

  parameters:
    RunID:
      name: run_id
      in: path
      required: true
      description: The run's UUID.
      schema:
        type: string
        format: uuid
    StepID:
      name: step_id
      in: path
      required: true
      description: The step's id within the run's graph (the definition's step id).
      schema:
        type: string
    DefinitionName:
      name: name
      in: path
      required: true
      description: The definition name (the spec's `name` field).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Client-chosen idempotency token, at most 200 bytes (longer is a
        `400`). Same key + same payload replays the original run (`200`,
        `reused: true`); same key + different payload is a `409` with
        code `idempotency_key_conflict`. Tokens are global across API
        keys.
      schema:
        type: string
        maxLength: 200
    IfMatchVersion:
      name: If-Match
      in: header
      required: false
      description: >
        Optimistic-concurrency precondition on a definition-version append
        (ticket 17.6): the version number the client opened the definition at,
        as a positive integer. If the name's latest version has advanced past
        it, the append is refused with `409 version_conflict`. Absent skips the
        check.
      schema:
        type: integer
        minimum: 1
    PageLimit:
      name: limit
      in: query
      description: Page size; an integer in [1, 200].
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      description: >
        Opaque keyset cursor from the previous page's `next_cursor`;
        pass it back verbatim. A cursor from one list endpoint is not
        valid on another. Garbage is a `400`.
      schema:
        type: string

  headers:
    RetryAfter:
      description: >
        Whole seconds (rounded up) until the denying bucket refills
        enough to admit this request.
      schema:
        type: integer
        minimum: 1
    XRateLimitLimit:
      description: The caller's class-bucket capacity.
      schema:
        type: integer
    XRateLimitRemaining:
      description: Whole tokens remaining in the caller's class bucket.
      schema:
        type: integer
    XRateLimitReset:
      description: Whole seconds until the caller's class bucket is full again.
      schema:
        type: integer
    WWWAuthenticate:
      description: Always `Bearer` — the API's only challenge scheme.
      schema:
        type: string

  responses:
    BadRequest:
      description: >
        The request is malformed (code `invalid_request`), the submitted
        definition failed decoding or validation (code
        `invalid_definition`, with `issues`), or a referenced stored
        definition does not exist (code `definition_not_found`, on
        submit-by-ref).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid-request:
              summary: Malformed request
              value:
                error:
                  code: invalid_request
                  message: one of definition or definition_id is required
            invalid-definition:
              summary: Definition failed validation
              value:
                error:
                  code: invalid_definition
                  message: definition failed validation
                  issues:
                    - code: edge_endpoint_unknown
                      severity: error
                      path: $.edges[0].from
                      msg: edge references unknown step "fethc"
    Unauthorized:
      description: >
        Missing or invalid credential (code `unauthorized`). Every
        credential failure — absent header, bad shape, unknown key,
        revoked, expired — collapses to this one indistinguishable
        response.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: unauthorized, message: missing or invalid credentials }
    Forbidden:
      description: >
        The credential is valid but lacks the route's scope (code
        `forbidden`); the message names the missing scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: forbidden, message: "missing scope: submit" }
    NotFound:
      description: >
        The addressed entity does not exist — code `run_not_found`,
        `step_not_found`, `definition_not_found`, or `key_not_found`
        depending on the route. (Requests outside the route table answer
        `404` with code `not_found`.)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: run_not_found
              message: no run with id 018f3b1c-1111-7000-8000-000000000000
    Conflict:
      description: >
        The request is well-formed but the entity's current state refuses
        it (code `conflict`) — cancelling a finished run, unparking a
        running run, requeueing a step that is not dead-lettered,
        registering a definition name that already exists. The message
        names the actual state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: "run 018f3b1c-1111-7000-8000-000000000000 is succeeded, not running"
    IdempotencyConflict:
      description: >
        The `Idempotency-Key` was seen before with a different payload
        (code `idempotency_key_conflict`); the replay is refused instead
        of returning the original run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: idempotency_key_conflict
              message: Idempotency-Key was already used by run 018f3b1c-1111-7000-8000-000000000000 with a different payload
    RateLimited:
      description: >
        Over a rate limit (code `rate_limited`). `Retry-After` comes from
        whichever bucket denied (per-key class bucket or the global
        safety bucket); the `X-RateLimit-*` headers always describe the
        caller's class bucket.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-RateLimit-Limit:
          $ref: "#/components/headers/XRateLimitLimit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/XRateLimitRemaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/XRateLimitReset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: rate_limited, message: rate limit exceeded }
    Internal:
      description: The request was fine, the server was not (code `internal`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: internal, message: creating run failed }
    CacheUnavailable:
      description: >
        The response-cache ops surface is not enabled on this API (code
        `cache_unavailable`) — caching is disabled or the API was built
        without the cache store. The cache is an opt-in extra, never a boot
        dependency (ADR-002); enable it to use bust/stats.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: cache_unavailable, message: response cache is not enabled on this API }
    StreamUnavailable:
      description: >
        Event streaming is not enabled on this API instance (code
        `stream_unavailable`, ticket 16.3). The durable feed stays available via
        `GET /v1/runs/{id}` and the events backfill; only the live WebSocket is
        off. Configure a WS ticket secret to enable it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: stream_unavailable, message: event streaming is not enabled on this server }
    DecisionInvalid:
      description: >
        The decision is not permitted by the gate (code
        `approval_decision_invalid`, ADR-017, ticket 15.3) — a decision outside
        the allowed set, an edit where none is permitted, an edit on a
        non-approve decision, or an edited payload that violates the edit
        schema. The `issues` carry the schema violations (RFC 6901 pointers).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: approval_decision_invalid
              message: edited payload does not satisfy the edit schema
              issues:
                - { severity: error, path: /text, msg: "got number, want string" }

  schemas:
    # --- The workflow definition contract (generated; do not inline). ---
    WorkflowDefinition:
      $ref: "../docs/schema/workflow-definition.v1.json"
      description: >
        A workflow definition document (ADR-003, contract version 1). The
        schema is generated from the Go structs by `make generate`; this
        spec references the generated file rather than duplicating it.

    # --- Error envelope. ---
    Error:
      type: object
      description: The envelope every non-2xx response carries.
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      description: The error payload inside the envelope.
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable explanation; not machine-stable.
        issues:
          type: array
          description: >
            Path-qualified definition problems (decode errors and M1
            validation findings, warnings included), present only with
            code `invalid_definition`.
          items:
            $ref: "#/components/schemas/Issue"
    ErrorCode:
      type: string
      description: >
        Stable machine-readable error code; renaming one is a breaking
        change.
      enum:
        - invalid_request
        - invalid_definition
        - definition_not_found
        - run_not_found
        - step_not_found
        - key_not_found
        - unauthorized
        - forbidden
        - rate_limited
        - conflict
        - idempotency_key_conflict
        - version_conflict
        - not_found
        - method_not_allowed
        - internal
        - cache_unavailable
        - approval_not_found
        - approval_not_pending
        - approval_decision_invalid
        - stream_unavailable
        - bad_message
        - filter_invalid
        - subscription_limit
        - unknown_subscription
    Issue:
      type: object
      description: One path-qualified definition problem.
      required: [severity, msg]
      properties:
        code:
          type: string
          description: The dag validation code; empty for codec-level errors.
        severity:
          type: string
          enum: [error, warning]
        path:
          type: string
          description: JSON path of the offender; empty means the document.
        msg:
          type: string

    # --- Vocabularies (ADR-004/006 status machines, ADR-007 scopes). ---
    RunStatus:
      type: string
      description: >
        Run states. `parked` and `cancelling` are non-terminal;
        `succeeded`, `failed`, and `cancelled` are terminal (a `failed`
        run can be re-opened by a dead-letter requeue).
      enum: [running, succeeded, failed, parked, cancelling, cancelled]
    StepStatus:
      type: string
      description: >
        Step states. `dead_lettered` is the terminal failure state
        (`failed` appears only on rows predating migration 0005);
        `cancelled` steps were written off and may be revived by a
        requeue; `collected` is a map instance whose terminal failure was
        tolerated under `on_item_failure: collect_errors` (ADR-015) — the run
        did not fail on it and the generated gather collected an error marker;
        `awaiting_human` is a `human_approval` step parked without a lease
        awaiting a decision (ADR-017) — non-terminal, the run stays running.
      enum:
        - pending
        - ready
        - running
        - succeeded
        - failed
        - skipped
        - retrying
        - dead_lettered
        - cancelled
        - collected
        - awaiting_human
    AttemptOutcome:
      type: string
      description: >
        How an attempt ended: `succeeded`; a judged failure class
        (`transient`, `permanent`, `timeout` — ADR-006); `validation_failed`
        (the executor succeeded but the output failed its validation chain,
        ADR-013 — a genuine ADR-006 class, still excluded from the transport
        retry budget); `cancelled` by run-level control flow; or an
        administrative outcome outside the taxonomy — `lost` (lease-expiry
        takeover), `throttled` (a fleet-wide rate-limit denial deferred the
        attempt, ADR-010), or `budget_exceeded` (the claim's projected spend
        would exceed the run budget and the run parked, ADR-012) — none of
        which is counted against the retry budget.
      enum: [succeeded, transient, permanent, timeout, cancelled, lost, throttled, budget_exceeded, validation_failed]
    Scope:
      type: string
      description: >
        API key scopes (ADR-007). `admin` implies all; `approve` is
        reserved until M15 and accepted at key creation.
      enum: [submit, read, approve, admin]

    # --- Health. ---
    HealthStatus:
      type: object
      description: The liveness probe's answer.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]

    # --- Run submission & inspection. ---
    SubmitRunRequest:
      type: object
      description: >
        Exactly one of `definition` (inline document) and `definition_id`
        (stored definition ref) must be set.
      additionalProperties: false
      properties:
        definition:
          $ref: "#/components/schemas/WorkflowDefinition"
        definition_id:
          type: string
          format: uuid
          description: A stored definition's UUID (not a name).
        params:
          description: >
            Run parameters, stored opaquely and exposed to step config
            rendering. Any JSON value.
    SubmitRunResponse:
      type: object
      description: The submitted (or replayed) run.
      required: [run_id, status, entry_steps]
      properties:
        run_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RunStatus"
        entry_steps:
          type: array
          description: The step ids made ready at instantiation.
          items:
            type: string
        reused:
          type: boolean
          description: >
            True when the Idempotency-Key matched an earlier submission
            and this is the original run (status `200`). Absent on
            creation.
    RunView:
      type: object
      description: The run row's client-facing projection.
      required:
        - id
        - status
        - on_failure
        - steps_total
        - steps_succeeded
        - steps_failed
        - steps_skipped
        - steps_cancelled
        - steps_collected
        - created_at
        - event_seq
        - cost
      properties:
        id:
          type: string
          format: uuid
        definition_id:
          type: string
          format: uuid
          description: The stored definition this run was submitted from; absent for inline submissions.
        status:
          $ref: "#/components/schemas/RunStatus"
        on_failure:
          type: string
          description: The run's materialized failure policy (ADR-006).
          enum: [fail_fast, continue_independent_branches]
        steps_total:
          type: integer
        steps_succeeded:
          type: integer
        steps_failed:
          type: integer
        steps_skipped:
          type: integer
        steps_cancelled:
          type: integer
        steps_collected:
          type: integer
          description: Map instances tolerated under collect_errors (ADR-015) — terminal failures the run did not fail on.
        park_reason:
          type: string
          description: Why the run is parked; only on parked runs. `budget_exceeded` (M10) and `awaiting_human` (M15) are reserved.
          enum: [manual, budget_exceeded, awaiting_human]
        cancel_reason:
          type: string
          description: Why the run was cancelled; only on cancelling/cancelled runs.
          enum: [manual, deadline_exceeded]
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
          description: The materialized max_wall_clock deadline; absent when the definition sets none.
        event_seq:
          type: integer
          format: int64
          description: >
            The run's highest event sequence number as of this read (ADR-018,
            ticket 18.1) — equal to max(events.seq). The dashboard's as-of /
            resume cursor: patch derived run state from the live feed only for
            events with a higher seq, and subscribe/backfill the WS stream from
            this value so a REST row and a WS snapshot resume from an exact point.
        cost:
          $ref: "#/components/schemas/CostSummaryView"
    CostSummaryView:
      type: object
      description: |
        A run's cumulative cost and spend budget (ADR-012). Money is integer
        nano-USD (1 USD = 1e9) — the exact source of truth; the `*_usd` strings
        are the derived human-readable USD rendering. Budget fields are absent
        on an unbudgeted run; `on_budget_exceeded` is always present.
      required: [spent_nano_usd, saved_nano_usd, spent_usd, saved_usd, on_budget_exceeded]
      properties:
        spent_nano_usd:
          type: integer
          format: int64
          description: Cumulative spend in nano-USD.
        saved_nano_usd:
          type: integer
          format: int64
          description: Cumulative cache savings in nano-USD (ADR-011 counterfactual).
        spent_usd:
          type: string
          description: spent_nano_usd rendered as a USD decimal string.
        saved_usd:
          type: string
          description: saved_nano_usd rendered as a USD decimal string.
        budget_nano_usd:
          type: integer
          format: int64
          description: The run's spend budget in nano-USD; absent when unbudgeted (ticket 10.3).
        budget_usd:
          type: string
          description: budget_nano_usd rendered as a USD decimal string; absent when unbudgeted.
        on_budget_exceeded:
          type: string
          enum: [park, fail]
          description: Action when a claim's projected spend would exceed the budget.
    StepView:
      type: object
      description: One run step with its attempt history.
      required: [id, type, status, remaining_deps, fired_deps, attempt_count, transport_failures, validation_failures]
      properties:
        id:
          type: string
        type:
          type: string
          description: The step type from the definition (llm, tool, branch, join, ...).
        status:
          $ref: "#/components/schemas/StepStatus"
        remaining_deps:
          type: integer
          description: Dependencies still unresolved before the step can become ready.
        fired_deps:
          type: integer
        attempt_count:
          type: integer
        output:
          description: The successful attempt's output document. Any JSON value.
        error:
          description: The last failure document. Any JSON value.
        transport_failures:
          type: integer
          description: >
            Count of the step's transport-retry failures (attempt outcomes
            transient/timeout — ADR-006). Disjoint from validation_failures:
            the transport and semantic retry budgets are separate.
        validation_failures:
          type: integer
          description: >
            Count of the step's output-validation failures (attempt outcome
            validation_failed — ADR-013, ticket 11.4). Disjoint from
            transport_failures.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/AttemptView"
        validation:
          $ref: "#/components/schemas/ValidationSummary"
    ValidationSummary:
      type: object
      description: >
        A step's output-validation roll-up (ticket 11.6, ADR-013): a compact
        summary derived at read time from the step's attempt verdicts. Present
        only when at least one attempt carried a verdict; absent for every
        unvalidated step.
      required: [attempts, passed, failed, last_attempt, last_status, last_issue_count]
      properties:
        attempts:
          type: integer
          description: How many of the step's attempts carried a verdict.
        passed:
          type: integer
          description: Verdicts with overall status pass.
        failed:
          type: integer
          description: Verdicts with overall status fail.
        last_attempt:
          type: integer
          description: Attempt number of the most recent verdict.
        last_status:
          type: string
          enum: [pass, fail]
          description: Overall status of the most recent verdict.
        last_score:
          type: number
          format: double
          description: >
            The most recent verdict's overall score (the chain minimum), when
            one was reported; absent otherwise.
        last_issue_count:
          type: integer
          description: Number of issues on the most recent verdict.
        validators:
          type: array
          description: Per-validator roll-up in the latest verdict's chain order.
          items:
            $ref: "#/components/schemas/ValidatorSummary"
    ValidatorSummary:
      type: object
      description: One validator's roll-up across a step's attempts (ticket 11.6).
      required: [name, passed, failed, skipped, errored, last_status]
      properties:
        name:
          type: string
          description: The validator's plugin name.
        passed:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
          description: Results where a cheaper validator already failed (cheap-first ordering).
        errored:
          type: integer
          description: Results where a cost-bearing validator errored under on_error=skip.
        last_status:
          type: string
          enum: [pass, fail, skipped, error]
          description: This validator's status on the step's most recent verdict.
        last_score:
          type: number
          format: double
          description: >
            This validator's most recent reported score; absent when it reports
            none (every deterministic validator).
    AttemptView:
      type: object
      description: One execution try of a step.
      required: [attempt, claim_id]
      properties:
        attempt:
          type: integer
          description: 1-based durable attempt number.
        claim_id:
          type: string
          format: uuid
          description: The fencing token the attempt held.
        outcome:
          $ref: "#/components/schemas/AttemptOutcome"
        error:
          description: The attempt's failure document. Any JSON value.
        usage:
          type: object
          description: >
            Token accounting for a successful llm attempt (ticket 8.6);
            absent for every other step type and outcome. Feeds M10's
            cost ledger. On a response-cache hit (ticket 9.5) the attempt
            carries the counterfactual "would-have-cost" usage marked
            cache_hit=true — the tokens were not spent, so this records the
            savings rather than real usage.
          properties:
            input_tokens:
              type: integer
              format: int64
            output_tokens:
              type: integer
              format: int64
            cache_hit:
              type: boolean
              description: >
                True when the attempt was served from the response cache
                (ticket 9.5); the token counts are counterfactual, not
                spend. Absent on every real (non-cached) attempt.
        verdict:
          $ref: "#/components/schemas/Verdict"
        repair:
          $ref: "#/components/schemas/RepairProvenance"
        feedback:
          $ref: "#/components/schemas/Feedback"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    Feedback:
      type: object
      description: >
        The semantic-retry critique an attempt was given (ticket 11.4,
        ADR-013). Present on a feedback-augmented re-attempt of a step with a
        semantic policy (validation.max_attempts >= 2); absent on a first
        attempt. The `text` is the critique folded into the attempt's request.
      required: [schema_version, semantic_attempt, max_attempts, prior_attempt]
      properties:
        schema_version:
          type: integer
          description: Feedback record version (1).
        semantic_attempt:
          type: integer
          description: 1-based semantic attempt number this critique is for (2 on the first re-attempt).
        max_attempts:
          type: integer
          description: The step's semantic-retry budget (validation.max_attempts).
        prior_attempt:
          type: integer
          description: The durable attempt number whose rejected output produced this critique.
        text:
          type: string
          description: >
            The rendered critique folded into this attempt's request. Empty for
            a step type whose executor injects no text (it still re-attempts,
            identically).
    RepairProvenance:
      type: object
      description: >
        Structured-output provenance for an attempt of an llm step that
        declared an output_format (ticket 11.3, ADR-013): how the completion
        was shaped into structured JSON before the validate stage. Absent for
        every step without an output_format.
      required: [schema_version, status]
      properties:
        schema_version:
          type: integer
          description: Repair record version (1).
        status:
          type: string
          enum: [native, raw, repaired, unrepairable]
          description: >
            native = the provider emitted structured output directly; raw =
            the completion text was already valid JSON; repaired = a
            deterministic pass fixed it; unrepairable = no pass produced valid
            JSON (left to the semantic-retry loop).
        steps:
          type: array
          description: The repair passes that changed the text, in order (structure only).
          items:
            type: string
        raw_text:
          type: string
          description: The model's pre-repair text, present only when status is `repaired`.
    Verdict:
      type: object
      description: >
        The output-validation chain verdict for an attempt whose step
        carried a validation chain (ticket 11.1, ADR-013). Present on a
        succeeded attempt (a passing verdict) and on a validation_failed
        attempt (a failing verdict with issues). Absent for unvalidated
        steps.
      required: [schema_version, status]
      properties:
        schema_version:
          type: integer
          description: Verdict schema version (1).
        status:
          type: string
          enum: [pass, fail]
          description: The chain's overall judgment.
        score:
          type: number
          description: >
            Overall [0,1] score — the minimum of the per-validator reported
            scores. Absent when no validator reported a score.
        issues:
          type: array
          description: Every failing validator's issues, in chain order.
          items:
            $ref: "#/components/schemas/VerdictIssue"
        results:
          type: array
          description: Per-validator breakdown, one entry per configured validator.
          items:
            $ref: "#/components/schemas/ValidatorResult"
    VerdictIssue:
      type: object
      description: One problem a validator found with the output.
      required: [validator, code, message]
      properties:
        validator:
          type: string
          description: The validator that raised the issue.
        code:
          type: string
          description: Machine-readable issue code (e.g. type_mismatch, target_not_found).
        path:
          type: string
          description: RFC 6901 JSON pointer into the validated value; empty means the whole value.
        message:
          type: string
          description: Human description of the problem — structure only, never instance values.
    ValidatorResult:
      type: object
      description: One validator's contribution to a chain verdict.
      required: [name, status, issue_count]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [pass, fail, skipped, error]
          description: >
            This validator's judgment. `skipped` = a cost-bearing validator
            the chain did not run because a cheaper one already failed.
            `error` = a cost-bearing validator (llm_judge) that errored under
            `on_error: skip`, so the chain did not fail but the judgment could
            not be rendered.
        score:
          type: number
        issue_count:
          type: integer
        rationale:
          type: string
          description: >
            A cost-bearing validator's (llm_judge) explanation of its
            judgment, on a pass and a fail alike. Absent for deterministic
            validators.
        usage:
          $ref: '#/components/schemas/ValidatorUsage'
          description: >
            A cost-bearing validator's token accounting; present only when the
            validator made a metered provider call. The engine ledgers this as
            overhead on the serving step (ADR-012 rule 4).
        error:
          type: string
          description: >
            The suppressed failure message when status is `error` — a judge
            that errored under `on_error: skip`.
        duration_ms:
          type: integer
          format: int64
    ValidatorUsage:
      type: object
      description: >
        A cost-bearing validator's token accounting (ticket 11.5): the
        resource its call bills to and the judge model's token counts. Carries
        no output or rubric text.
      required: [resource, model, input_tokens, output_tokens]
      properties:
        resource:
          type: string
          description: The <provider>:<model> resource the judge call bills to.
        model:
          type: string
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
    EdgeView:
      type: object
      description: One run edge with its resolution — enough to render the graph and see which paths fired.
      required: [from, to, type, resolution]
      properties:
        from:
          type: string
        to:
          type: string
        type:
          type: string
          enum: [normal, loop]
        resolution:
          type: string
          enum: [unresolved, fired, skipped]
    DeadLetterView:
      type: object
      description: >
        One DLQ record. `seq` counts the step's deaths;
        `attempts_at_death` is the baseline a requeue re-arms the retry
        budget from.
      required: [step_id, seq, source, attempts_at_death, created_at]
      properties:
        step_id:
          type: string
        seq:
          type: integer
        source:
          type: string
          description: >
            Why the step dead-lettered: a retryable class ran out of
            budget, a never-retryable failure, or the queue's poison
            threshold (delivery crash loop — `class` absent).
          enum: [retries_exhausted, permanent, poison]
        class:
          type: string
          description: The judged failure class; absent for poison.
          enum: [transient, permanent, timeout]
        error:
          description: The failure document at death. Any JSON value.
        attempts_at_death:
          type: integer
        created_at:
          type: string
          format: date-time
    RunResponse:
      type: object
      description: The full run view — run row, steps with attempts, edges, DLQ records, approval records.
      required: [run, steps, edges]
      properties:
        run:
          $ref: "#/components/schemas/RunView"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepView"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/EdgeView"
        dead_letters:
          type: array
          description: The run's DLQ records — how a client discovers requeueable steps. Absent for healthy runs.
          items:
            $ref: "#/components/schemas/DeadLetterView"
        approvals:
          type: array
          description: The run's human-approval records (ADR-017) — pending gates awaiting a decision, plus any decided/cancelled. Absent for runs without an approval gate.
          items:
            $ref: "#/components/schemas/ApprovalView"
    ApprovalView:
      type: object
      description: >
        One human-approval record (ADR-017, ticket 15.2): the rendered content
        shown to an approver and, once decided (15.3), the immutable decision.
        In 15.2 only `pending` and `cancelled` statuses appear.
      required: [id, step_id, attempt, status, title, allowed_decisions, created_at]
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
          description: The approval's run. Present on the GET /v1/approvals list; omitted on the run-status view (already run-scoped).
        step_id:
          type: string
        attempt:
          type: integer
        status:
          type: string
          enum: [pending, approved, rejected, expired, cancelled]
        title:
          type: string
          description: Rendered headline shown to the approver.
        description:
          type: string
        payload:
          description: The proposed action shown for review. Any JSON value.
        allowed_decisions:
          type: array
          items:
            type: string
            enum: [approve, reject]
        allow_edit:
          type: boolean
        edit_schema:
          description: JSON Schema constraining an edited payload; absent if any JSON edit is accepted.
        timeout_at:
          type: string
          format: date-time
          description: When the timeout policy fires (ADR-017); absent = wait indefinitely.
        decision:
          type: string
          description: The recorded decision; present once decided (15.3).
          enum: [approve, reject]
        edited_payload:
          description: The approver's edited payload, if any. Any JSON value.
        comment:
          type: string
        decided_by:
          type: string
          description: The deciding key id, or `system:timeout` for a timeout decision.
        decided_at:
          type: string
          format: date-time
        decision_source:
          type: string
          enum: [human, timeout]
        expired_at:
          type: string
          format: date-time
          description: >
            Set once a timeout policy fired (ticket 15.4). A reject/approve
            policy sets status `expired`; a `park` policy leaves status
            `pending` (still decidable) with this marking that the run was
            parked.
        created_at:
          type: string
          format: date-time
    ApprovalListResponse:
      type: object
      description: >
        One keyset page of approvals (ADR-017, ticket 15.3), oldest-first — the
        pending-approval inbox. `next_cursor` is the opaque cursor for the next
        page; absent on the last page.
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalView"
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when the page is the last.
    DecideApprovalRequest:
      type: object
      additionalProperties: false
      description: >
        A decision on a pending approval (ADR-017, ticket 15.3): the decision,
        an optional edited payload (approve only, constrained by the gate's
        edit schema), and an optional comment recorded in the audit trail.
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        edited_payload:
          description: >
            Replaces the original payload as the step's output payload (approve
            only, and only when the gate permits edits). Any JSON value.
        comment:
          type: string
          description: Optional approver note, recorded immutably.
    DecideApprovalResponse:
      type: object
      description: >
        The decision result (ticket 15.3): the decided approval (carrying the
        immutable decision record), the run rollup after settlement, and the
        successors this decision made ready. The settled step's status is
        visible via GET /v1/runs/{id}.
      required: [approval, run, readied_steps]
      properties:
        approval:
          $ref: "#/components/schemas/ApprovalView"
        run:
          $ref: "#/components/schemas/RunView"
        readied_steps:
          type: array
          items:
            type: string
    RunGraphResponse:
      type: object
      description: >
        A run's current versioned graph with provenance (ADR-015, ticket
        13.6): the definition-authored graph is version 1, and each planner /
        map / loop expansion bumps the version. Every node and edge carries the
        version at which it was introduced; `expansions` is the ordered
        per-version delta feed reconstructed from the run's `graph_expanded`
        events. A client reconstructs any version N by keeping the nodes and
        edges whose `graph_version` is at most N.
      required: [run_id, graph_version, steps_total, nodes, edges, expansions, event_seq]
      properties:
        run_id:
          type: string
          format: uuid
        graph_version:
          type: integer
          description: The current (highest) version = expansion count + 1.
        steps_total:
          type: integer
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNodeView"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdgeView"
        expansions:
          type: array
          description: The ordered per-version expansion deltas; empty for a run that never expanded.
          items:
            $ref: "#/components/schemas/GraphExpansionView"
        event_seq:
          type: integer
          format: int64
          description: >
            The run's highest event sequence number as of this read
            (`runs.next_seq` = `max(events.seq)`; ticket 18.2) — the dashboard's
            as-of / resume cursor. A live `graph_expanded` event is folded over
            this graph only when its `seq` exceeds this value, so a graph read
            and the event feed reconcile without double-applying an expansion
            this response already reflects.
    GraphOriginView:
      type: object
      description: >
        A node's or edge's provenance. `kind` is `definition` for an authored
        row, or the expansion kind (`planner` / `map` / `loop`) with `step`
        naming the step whose completion injected the row.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [definition, planner, map, loop]
        step:
          type: string
          description: The injecting step id; absent for an authored (definition) row.
    GraphNodeView:
      type: object
      description: One graph node with its live status and provenance.
      required: [id, type, status, depth, graph_version, origin, added_at]
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
        depth:
          type: integer
          description: Expansion nesting depth; 0 for an authored node.
        graph_version:
          type: integer
          description: The version at which the node was introduced.
        origin:
          $ref: "#/components/schemas/GraphOriginView"
        added_at:
          type: string
          format: date-time
          description: Run creation time for authored nodes; the expansion event time for injected ones.
        position:
          $ref: "#/components/schemas/GraphPositionView"
    GraphPositionView:
      type: object
      description: >
        An authored node's canvas position hint (ticket 18.2), lifted from the
        run's definition snapshot `ui.nodes.<id>.position`. Present only for an
        authored node whose definition carried a `ui` hint; injected nodes have
        none and are laid out incrementally by the dashboard.
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
    GraphEdgeView:
      type: object
      description: One graph edge with its resolution and provenance.
      required: [from, to, type, resolution, graph_version, origin]
      properties:
        from:
          type: string
        to:
          type: string
        type:
          type: string
          enum: [normal, loop]
        when:
          type: string
          description: The edge's CEL guard, when conditioned; absent otherwise.
        decision:
          type: string
          enum: [approve, reject]
          description: >
            The human-approval routing marker (ticket 15.3) on an edge leaving
            an approval gate; absent otherwise. The dashboard renders such an
            edge from the matching source port (ticket 18.2).
        resolution:
          type: string
          enum: [unresolved, fired, skipped]
        graph_version:
          type: integer
        origin:
          $ref: "#/components/schemas/GraphOriginView"
    GraphEdgeRef:
      type: object
      description: An edge introduced by an expansion, by endpoints and type.
      required: [from, to, type]
      properties:
        from:
          type: string
        to:
          type: string
        type:
          type: string
          enum: [normal, loop]
    GraphExpansionView:
      type: object
      description: >
        One expansion's delta, reconstructed from a `graph_expanded` event.
        `version` is the version this expansion produced (`from_version` + 1);
        `readied` are the injected steps made immediately runnable and `widened`
        are the pre-existing pending steps whose dependency counts it grew.
      required: [version, from_version, origin_step, origin_kind, depth, added_at, added_steps, added_edges]
      properties:
        version:
          type: integer
        from_version:
          type: integer
        origin_step:
          type: string
        origin_kind:
          type: string
          enum: [planner, map, loop]
        depth:
          type: integer
        added_at:
          type: string
          format: date-time
        added_steps:
          type: array
          items:
            type: string
        added_edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdgeRef"
        readied:
          type: array
          items:
            type: string
        widened:
          type: array
          items:
            type: string
    RunCostResponse:
      type: object
      description: >
        A run's cost breakdown (ADR-012): cumulative summary, per-step and
        per-resource (per-model / per-tool) roll-ups, and the full
        per-attempt ledger.
      required: [run_id, summary, by_step, by_resource, entries]
      properties:
        run_id:
          type: string
          format: uuid
        summary:
          $ref: "#/components/schemas/CostSummaryView"
        by_step:
          type: array
          items:
            $ref: "#/components/schemas/CostByStepView"
        by_resource:
          type: array
          items:
            $ref: "#/components/schemas/CostByResourceView"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CostEntryView"
    CostByStepView:
      type: object
      description: One step's spend/savings roll-up.
      required: [step_id, entries, spent_nano_usd, saved_nano_usd, overhead_nano_usd, spent_usd, saved_usd, overhead_usd]
      properties:
        step_id:
          type: string
        entries:
          type: integer
          format: int64
          description: Number of ledger rows attributed to the step.
        spent_nano_usd:
          type: integer
          format: int64
        saved_nano_usd:
          type: integer
          format: int64
        overhead_nano_usd:
          type: integer
          format: int64
          description: >
            The slice of spend attributed to validation machinery — an
            llm_judge's provider call (ADR-012 rule 4). Zero for steps with no
            cost-bearing validators.
        spent_usd:
          type: string
        saved_usd:
          type: string
        overhead_usd:
          type: string
    CostByResourceView:
      type: object
      description: >
        One model's or tool's spend/savings roll-up. `resource` is the model
        name (`mock:sim-1`) or `tool:<name>`; token sums are zero for tool
        rows.
      required:
        - resource
        - entries
        - input_tokens
        - output_tokens
        - spent_nano_usd
        - saved_nano_usd
        - spent_usd
        - saved_usd
      properties:
        resource:
          type: string
        entries:
          type: integer
          format: int64
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        spent_nano_usd:
          type: integer
          format: int64
        saved_nano_usd:
          type: integer
          format: int64
        spent_usd:
          type: string
        saved_usd:
          type: string
    CostEntryView:
      type: object
      description: >
        One cost_ledger row: what a single attempt cost, at what rate, with
        what provenance. Cache-hit rows carry spend 0 and a saved figure.
      required:
        - step_id
        - attempt
        - entry
        - resource
        - rate
        - rate_source
        - cache_hit
        - overhead
        - spent_nano_usd
        - saved_nano_usd
        - created_at
      properties:
        step_id:
          type: string
        attempt:
          type: integer
          description: The 1-based attempt number this charge is for.
        entry:
          type: string
          description: The charge kind — `attempt` for the productive call; overhead kinds (M11/M12) reserved.
        resource:
          type: string
          description: The cost resource — model name or `tool:<name>`.
        usage:
          description: The attempt's token accounting; absent for tool rows. Any JSON object.
        rate:
          description: The resolved rate snapshot that priced the row. Any JSON object.
        rate_source:
          type: string
          description: How the rate resolved.
          enum: [exact, wildcard, fallback]
        cache_hit:
          type: boolean
          description: The attempt was served from the response cache — spend 0, with a counterfactual saved figure.
        overhead:
          type: boolean
          description: A judge/summarization charge (ADR-012 rule 4); always false in M10.
        spent_nano_usd:
          type: integer
          format: int64
        saved_nano_usd:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    ListRunsResponse:
      type: object
      description: One keyset page of runs, newest first.
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunView"
        next_cursor:
          type: string
          description: Opaque cursor fetching the next page of runs; absent on the last page.

    # --- Run lifecycle. ---
    CancelRunResponse:
      type: object
      description: What the cancel request settled immediately.
      required: [run, cancelled_steps, finalized]
      properties:
        run:
          $ref: "#/components/schemas/RunView"
        cancelled_steps:
          type: array
          description: Claimless steps the request's sweep cancelled immediately.
          items:
            type: string
        finalized:
          type: boolean
          description: >
            True when nothing was in flight and the run went straight to
            `cancelled`; false means it rests at `cancelling` until
            in-flight steps settle.
    ParkRunResponse:
      type: object
      description: The parked run.
      required: [run]
      properties:
        run:
          $ref: "#/components/schemas/RunView"
    UnparkRunResponse:
      type: object
      description: The resumed run and what was re-dispatched.
      required: [run, dispatched]
      properties:
        run:
          $ref: "#/components/schemas/RunView"
        dispatched:
          type: array
          description: Ready steps re-dispatched because their deliveries were consumed while parked.
          items:
            type: string
    SetBudgetRequest:
      type: object
      description: The new run spend budget in US dollars (ticket 10.3).
      additionalProperties: false
      required: [budget_usd]
      properties:
        budget_usd:
          type: number
          description: The new spend budget in US dollars; must be positive.
    SetBudgetResponse:
      type: object
      description: The run whose spend budget was raised, with its refreshed cost summary.
      required: [run]
      properties:
        run:
          $ref: "#/components/schemas/RunView"
    RequeueStepResponse:
      type: object
      description: The requeued step, back in ready with its budget re-armed.
      required: [run_id, step_id, status, run_resumed, dispatched]
      properties:
        run_id:
          type: string
          format: uuid
        step_id:
          type: string
        status:
          $ref: "#/components/schemas/StepStatus"
        run_resumed:
          type: boolean
          description: True when the requeue re-opened a failed run.
        revived:
          type: array
          description: Written-off descendant steps brought back to pending.
          items:
            type: string
        dispatched:
          type: array
          description: Steps re-dispatched by the requeue (the requeued step plus any stranded ready steps).
          items:
            type: string

    # --- Per-step logs (ticket 7.4). ---
    LogLevel:
      type: string
      description: Step-log severity, canonicalized at capture.
      enum: [debug, info, warn, error]
    StepLogLineView:
      type: object
      description: One captured executor log line.
      required: [seq, level, message, logged_at]
      properties:
        seq:
          type: integer
          format: int64
          description: >
            The line's position in the attempt's log stream, 1-based and
            monotonic; gaps mark lines lost to the capture buffer or the
            ring cap.
        level:
          $ref: "#/components/schemas/LogLevel"
        message:
          type: string
          description: The log message, truncated with an explicit marker when oversized.
        fields:
          type: object
          description: The executor call-site attributes as one JSON object; absent when the line had none.
        trace_id:
          type: string
          description: The attempt's trace id (hex) for joining to traces; absent when tracing was off at capture.
        logged_at:
          type: string
          format: date-time
    StepLogsResponse:
      type: object
      description: One ascending-seq keyset page of one attempt's captured log lines.
      required: [run_id, step_id, attempt, lines, truncated]
      properties:
        run_id:
          type: string
          format: uuid
        step_id:
          type: string
        attempt:
          type: integer
          description: The attempt served; 0 when the step has never been attempted.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/StepLogLineView"
        truncated:
          type: boolean
          description: True when the attempt lost lines to the ring cap or capture buffer; the retained window is the newest lines.
        dropped_lines:
          type: integer
          format: int64
          description: How many lines were lost (derived as max seq minus stored rows). Absent when zero.
        next_cursor:
          type: string
          description: Opaque cursor fetching the next page of lines; absent on the last page.

    # --- Blackboard (ADR-014, ticket 12.2). ---
    BlackboardEntryView:
      type: object
      description: One version of one run-scoped blackboard key.
      required: [key, version, value, token_count, token_counter, tags, created_at]
      properties:
        key:
          type: string
        version:
          type: integer
          minimum: 1
        value:
          description: The stored JSON value (any JSON — string, object, array, number).
        token_count:
          type: integer
          description: The value's token size under token_counter.
        token_counter:
          type: string
          description: The token counter fingerprint that produced token_count (e.g. "openai/o200k_base@1").
        tags:
          type: array
          items:
            type: string
          description: The entry's labels; may include the reserved "pinned" tag.
        author_step_id:
          type: string
          description: The step that wrote this version; absent for a non-step writer.
        author_attempt:
          type: integer
          description: The 1-based attempt of the authoring step; absent for a non-step writer.
        created_at:
          type: string
          format: date-time
    BlackboardResponse:
      type: object
      description: One keyset page of a run's blackboard — each key's head, or every version when history is true.
      required: [run_id, history, entries]
      properties:
        run_id:
          type: string
          format: uuid
        history:
          type: boolean
          description: True when entries are the full version history; false when they are per-key heads.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/BlackboardEntryView"
        next_cursor:
          type: string
          description: Opaque cursor fetching the next page; absent on the last page.

    # --- Definition registry. ---
    CreateDefinitionRequest:
      type: object
      description: The body of definition create and new-version requests.
      required: [definition]
      additionalProperties: false
      properties:
        definition:
          $ref: "#/components/schemas/WorkflowDefinition"
    DefinitionView:
      type: object
      description: One registry row's summary — everything but the spec.
      required: [id, name, version, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    DefinitionResponse:
      description: A registry row with its stored canonical spec.
      allOf:
        - $ref: "#/components/schemas/DefinitionView"
        - type: object
          required: [spec]
          properties:
            spec:
              $ref: "#/components/schemas/WorkflowDefinition"
    ListDefinitionsResponse:
      type: object
      description: One keyset page of definitions (latest per name), in name order.
      required: [definitions]
      properties:
        definitions:
          type: array
          items:
            $ref: "#/components/schemas/DefinitionView"
        next_cursor:
          type: string
          description: Opaque cursor fetching the next page of definitions; absent on the last page.
    DefinitionVersionsResponse:
      type: object
      description: Every stored version of one definition name.
      required: [versions]
      properties:
        versions:
          type: array
          description: Every version of the name, oldest first.
          items:
            $ref: "#/components/schemas/DefinitionView"

    # --- API keys. ---
    CreateKeyRequest:
      type: object
      description: The key-mint request (ADR-007).
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Human label shown in listings.
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        ttl:
          type: string
          description: >
            Optional positive Go duration (e.g. "720h") resolved to an
            absolute expiry against the server's clock. Empty means the
            key never expires.
    KeyView:
      type: object
      description: >
        One API key's client-facing projection: the 11-character lookup
        prefix is the only key material it ever carries.
      required: [id, prefix, name, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        prefix:
          type: string
          description: The first 11 characters of the plaintext key — for matching, not authentication.
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    CreateKeyResponse:
      description: >
        The minted key. `key` is the plaintext credential, shown in this
        response once and recoverable nowhere else.
      allOf:
        - $ref: "#/components/schemas/KeyView"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The plaintext bearer key (sk_ + 43 base64url chars).
    ListKeysResponse:
      type: object
      description: Every API key, newest first, revoked and expired included.
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/KeyView"

    # --- Plugins (ticket 8.1, ADR-009). ---
    PluginKind:
      type: string
      description: The plugin kind (ADR-009's closed vocabulary).
      enum: [executor, tool, retriever, model_provider, validator]
    PluginCapabilities:
      type: object
      description: >
        ADR-009's capability flags. All three are always present — a
        flag's absence and its falseness are the same statement.
      required: [side_effectful, cacheable, cost_bearing]
      properties:
        side_effectful:
          type: boolean
          description: >
            The plugin performs externally observable side effects; its
            executions journal, and its outputs are never cached.
        cacheable:
          type: boolean
          description: >
            The output is a function of (config, input) and caching is
            semantically sound — M9's response-cache eligibility.
        cost_bearing:
          type: boolean
          description: Executing the plugin spends money; M10 meters it.
    PluginInfo:
      type: object
      description: One plugin's manifest, as registered at boot.
      required: [kind, name, version, capabilities]
      properties:
        kind:
          $ref: "#/components/schemas/PluginKind"
        name:
          type: string
          description: >
            The plugin's name within its kind (for executors, the step
            type). Lowercase snake_case, at most 64 characters.
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 64
        version:
          type: string
          description: >
            Semver version string. Feeds M9's cache keys, so it bumps on
            any behavior change that should invalidate cached outputs;
            dev stubs carry a 0.x `-stub` pre-release.
        description:
          type: string
          description: Optional one-line human description.
        capabilities:
          $ref: "#/components/schemas/PluginCapabilities"
        config_schema:
          type: object
          additionalProperties: true
          description: >
            The plugin's generated config JSON Schema (draft 2020-12),
            embedded verbatim — generated from the same Go structs the
            engine decodes with, so it cannot drift. Absent when the
            plugin takes no config.
    ListPluginsResponse:
      type: object
      description: The plugin catalog, sorted by kind then name.
      required: [plugins]
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginInfo"

    # --- Response-cache ops (ticket 9.6, ADR-011). ---
    CacheBustRequest:
      type: object
      description: >
        The namespace selector for a cache bust. Omit both fields to bust
        every entry; `plugin_kind` alone busts one kind; `plugin_kind` with
        `plugin_name` busts one concrete plugin. `plugin_name` without
        `plugin_kind` is a 400.
      additionalProperties: false
      properties:
        plugin_kind:
          type: string
          description: The cacheable plugin kind to bust.
          enum: [model_provider, tool, retriever]
        plugin_name:
          type: string
          description: The concrete plugin within the kind; requires plugin_kind.
    CacheBustResponse:
      type: object
      description: The outcome of a bust.
      required: [deleted]
      properties:
        deleted:
          type: integer
          format: int64
          description: >
            Number of cache entries removed. Point-in-time — entries written
            concurrently after the scan passed their slot are not counted.
    CacheStatsResponse:
      type: object
      description: Per-plugin cumulative cache counters, sorted by kind then name.
      required: [plugins]
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/CachePluginStat"
    CachePluginStat:
      type: object
      description: One concrete plugin's cache counters with the derived hit rate.
      required: [kind, name, hits, misses, stores, hit_rate]
      properties:
        kind:
          type: string
          enum: [model_provider, tool, retriever]
        name:
          type: string
        hits:
          type: integer
          format: int64
        misses:
          type: integer
          format: int64
        stores:
          type: integer
          format: int64
        hit_rate:
          type: number
          format: double
          description: hits / (hits + misses); 0 when there were no lookups.
    WSTicketResponse:
      type: object
      description: >
        A short-lived signed ticket for the run event WebSocket (ticket 16.3).
        Opaque — passed back verbatim as the `ticket` query parameter.
      required: [ticket, expires_at]
      properties:
        ticket:
          type: string
          description: The opaque signed ticket.
        expires_at:
          type: string
          format: date-time
          description: When the ticket stops being accepted.
    WSSnapshotFrame:
      type: object
      description: >
        The first WebSocket frame (ticket 16.3): the run's current state, the
        same body as GET /v1/runs/{id}. Event frames follow.
      required: [type, run]
      properties:
        type:
          type: string
          enum: [snapshot]
        run:
          $ref: "#/components/schemas/RunResponse"
    WSEventFrame:
      type: object
      description: >
        One normalized event envelope (ticket 16.1/16.3), backfilled then live.
        Clients dedupe and order by (run_id, seq). The `event` schema is the
        generated event feed envelope (docs/schema/events.v1.json). On the
        firehose (16.4), `subscriptions` names the subscription ids this envelope
        matched; it is absent on the single-subscription run WebSocket.
      required: [type, event]
      properties:
        type:
          type: string
          enum: [event]
        event:
          $ref: "../docs/schema/events.v1.json"
        subscriptions:
          type: array
          items:
            type: string
          description: Firehose only — the matched subscription ids.
    WSSubscribedFrame:
      type: object
      description: >
        Firehose (ticket 16.4): acknowledges a `subscribe`, echoing the effective
        filter.
      required: [type, id, filter]
      properties:
        type:
          type: string
          enum: [subscribed]
        id:
          type: string
        filter:
          $ref: "#/components/schemas/WSFilter"
    WSUnsubscribedFrame:
      type: object
      description: "Firehose (ticket 16.4): acknowledges an `unsubscribe`."
      required: [type, id]
      properties:
        type:
          type: string
          enum: [unsubscribed]
        id:
          type: string
    WSFirehoseCaughtUpFrame:
      type: object
      description: >
        Firehose (ticket 16.4): marks the end of a subscription's cursor
        backfill. `cursors` reports the highest seq delivered per resumed run.
      required: [type, id, cursors]
      properties:
        type:
          type: string
          enum: [caught_up]
        id:
          type: string
        cursors:
          type: object
          additionalProperties:
            type: integer
            format: int64
    WSFilter:
      type: object
      description: >
        Firehose subscription filter (ticket 16.4). An empty filter matches every
        event. Fields are ANDed; values within run_ids/types are ORed.
      properties:
        run_ids:
          type: array
          items:
            type: string
            format: uuid
        types:
          type: array
          items:
            type: string
        definition_id:
          type: string
          format: uuid
        definition_name:
          type: string
    WSCaughtUpFrame:
      type: object
      description: >
        Marks the end of the backfill and the start of the live tail (ticket
        16.3). `last_seq` is the client's resume cursor at this point.
      required: [type, last_seq]
      properties:
        type:
          type: string
          enum: [caught_up]
        last_seq:
          type: integer
          format: int64
    WSErrorFrame:
      type: object
      description: >
        Sent before a non-normal WebSocket close (run WS, ticket 16.3) or in-band
        as a control-message rejection that leaves the connection open (firehose,
        ticket 16.4), so the client has a machine-readable reason. `id`, when
        present, names the subscription the error concerns.
      required: [type, code, message]
      properties:
        type:
          type: string
          enum: [error]
        code:
          type: string
        message:
          type: string
        id:
          type: string
