name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. repeated pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.12.2
      - name: generated artifacts are current
        run: |
          make generate
          git diff --exit-code -- docs/schema internal/store/gen
      - name: OpenAPI contract lints (ticket 6.6)
        # Route-coverage drift (spec vs chi route table) is enforced by
        # TestOpenAPIRouteCoverage in the unit-test job; this step owns
        # structural validity + style of the spec itself.
        run: make openapi-lint
      - name: no committed API keys (ticket 6.1, ADR-007)
        # Plaintext keys are sk_ + 43 base64url chars and may exist only in
        # one live HTTP response — never in the repo. Tests and docs must
        # construct key-shaped strings at runtime (or elide them), so any
        # committed sk_-shaped literal is a leak by definition.
        run: |
          if git grep -nE 'sk_[A-Za-z0-9_-]{30,}' -- ':!.github/workflows/ci.yml'; then
            echo '::error::found a committed sk_-shaped literal (see matches above)'
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race ./...

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: boot the compose dev stack
        # The same docker-compose.yml as local dev, so images, credentials,
        # healthchecks, and Redis AOF are mirrored by construction (GH
        # Actions service containers can't pass a command, so they couldn't
        # enable AOF). `make up` gates on the healthchecks via --wait.
        run: make up
      - name: go test (integration)
        run: go test -race -tags integration ./...
