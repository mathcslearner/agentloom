name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. repeated pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.12.2
      - name: generated artifacts are current
        run: |
          make generate
          git diff --exit-code -- docs/schema internal/store/gen
      - name: Prometheus alert rules — check + unit tests (ticket 7.5)
        # promtool runs from the same image tag the compose obs profile
        # pins, so what CI validates is exactly what the stack loads.
        run: make obs-lint
      - name: OpenAPI contract lints (ticket 6.6)
        # Route-coverage drift (spec vs chi route table) is enforced by
        # TestOpenAPIRouteCoverage in the unit-test job; this step owns
        # structural validity + style of the spec itself.
        run: make openapi-lint
      - name: no committed API keys (ticket 6.1, ADR-007)
        # Plaintext keys are sk_ + 43 base64url chars and may exist only in
        # one live HTTP response — never in the repo. Tests and docs must
        # construct key-shaped strings at runtime (or elide them), so any
        # committed sk_-shaped literal is a leak by definition.
        run: |
          if git grep -nE 'sk_[A-Za-z0-9_-]{30,}' -- ':!.github/workflows/ci.yml'; then
            echo '::error::found a committed sk_-shaped literal (see matches above)'
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race ./...

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: boot the compose dev stack
        # The same docker-compose.yml as local dev, so images, credentials,
        # healthchecks, and Redis AOF are mirrored by construction (GH
        # Actions service containers can't pass a command, so they couldn't
        # enable AOF). `make up` gates on the healthchecks via --wait.
        run: make up
      - name: go test (integration)
        run: go test -race -tags integration ./...

  web:
    # The typed TS event client (M16.5) and, from M17, the Next.js app.
    # pnpm is provided by Corepack; the exact version is pinned in
    # web/package.json's `packageManager` field.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
      - name: enable corepack (pnpm)
        run: corepack enable
      - name: install
        run: pnpm install --frozen-lockfile
      - name: generated TS types are current against the schemas + spec
        # engine-client/events.ts is generated from docs/schema/events.v1.json;
        # api-client/openapi.ts is generated from api/openapi.yaml. Both source
        # files are Go-CI-diffed (schema in the lint job, route/op coverage in the
        # api unit tests). Regenerate and fail on drift, so a Go wire-shape change
        # not reflected in the TS types fails CI on one side or the other.
        run: |
          pnpm generate
          git diff --exit-code -- lib/engine-client/src/generated lib/api-client/src/generated
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: unit tests
        run: pnpm test
      - name: build
        run: pnpm build
      - name: API key never reaches the browser bundle (proxy mode)
        # Builds the app with a sentinel key in the server env and asserts it
        # (and the env-var name) are absent from .next/static (ticket 17.1 DoD).
        run: pnpm --filter @agentloom/app run build:verify

  web-e2e:
    # Playwright smoke against the compose backend (ticket 17.1 DoD): the app
    # lists definitions/runs through the typed client and the same-origin proxy,
    # and no browser request carries the API key. scripts/web-e2e-smoke.sh boots
    # the app profile (generating an ephemeral root key), builds the app, and
    # runs the smoke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
      - name: enable corepack (pnpm)
        run: corepack enable
      - name: run the web e2e smoke against compose
        run: bash scripts/web-e2e-smoke.sh
      - name: upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/app/playwright-report/
          retention-days: 7
