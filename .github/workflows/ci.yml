name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. repeated pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.12.2
      - name: generated artifacts are current
        run: |
          make generate
          git diff --exit-code -- docs/schema internal/store/gen

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race ./...

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: boot the compose dev stack
        # The same docker-compose.yml as local dev, so images, credentials,
        # healthchecks, and Redis AOF are mirrored by construction (GH
        # Actions service containers can't pass a command, so they couldn't
        # enable AOF). `make up` gates on the healthchecks via --wait.
        run: make up
      - name: go test (integration)
        run: go test -race -tags integration ./...
