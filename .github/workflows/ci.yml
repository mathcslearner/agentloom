name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. repeated pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.12.2
      - name: generated artifacts are current
        run: |
          make generate
          git diff --exit-code -- docs/schema internal/store/gen

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race ./...

  test-integration:
    runs-on: ubuntu-latest
    services:
      # Keep images and credentials in sync with docker-compose.yml so tests
      # behave identically against CI services and the local dev stack.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentloom
          POSTGRES_PASSWORD: agentloom
          POSTGRES_DB: agentloom
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U agentloom -d agentloom"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test (integration)
        run: go test -race -tags integration ./...
